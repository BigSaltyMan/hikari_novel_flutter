name: Build Flutter Android APK

on:
  push:
    branches: [ "main" ] # 注意：如果主分支叫 master，请改成 master
  pull_request:
  workflow_dispatch:   # 支持手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 设置 Java 环境 (Android 编译需要)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. 设置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'   # 建议换成你项目实际使用的版本，如果不知道，写 3.x 也可以
          channel: 'stable'
          cache: true

      # 3. 获取依赖
      - name: Install dependencies
        run: flutter pub get

      # 4. 编译 Release APK
      - name: Build APK
        run: flutter build apk --release

      # 5. 上传 APK 作为构建产物 (Artifact)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hikari-novel-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
